<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letitedit — Free Online Tools</title>
  <meta name="description" content="Free, fast, and private online tools. No uploads, no watermarks.">
  <style>
    :root {
      --bg: #0a0a10;
      --panel: #14141c;
      --border: #2a2a3a;
      --text: #eaeaf2;
      --muted: #8a8aa0;
      --accent: #7c5cff;
      --accent-hover: #9b7cff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; width: 100%; }

    /* Header */
    .site-header {
      border-bottom: 1px solid var(--border);
      background: rgba(10, 10, 16, 0.8);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 70px;
      gap: 20px;
    }
    .logo { font-size: 20px; font-weight: 800; color: #fff; text-decoration: none; letter-spacing: -0.5px; }
    .logo span { color: var(--accent); }
    
    .search-box {
      display: flex;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 12px;
      width: 300px;
    }
    /* Explicitly sizing the SVG prevents the giant arch bug */
    .search-box svg { width: 18px; height: 18px; color: var(--muted); flex-shrink: 0; }
    .search-box input {
      background: transparent;
      border: none;
      color: var(--text);
      padding: 10px;
      width: 100%;
      outline: none;
      font-size: 14px;
    }

    /* Hero */
    .hero { text-align: center; padding: 60px 0 40px; }
    .hero h1 { font-size: 36px; font-weight: 800; margin-bottom: 12px; letter-spacing: -1px; }
    .hero p { color: var(--muted); font-size: 16px; }

    /* Grid */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      padding-bottom: 60px;
    }

    .tool-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .tool-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 10px 30px rgba(124, 92, 255, 0.1); }
    .tool-icon {
      font-size: 28px;
      margin-bottom: 16px;
      width: 48px;
      height: 48px;
      background: rgba(124, 92, 255, 0.1);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }
    .tool-card h3 { font-size: 18px; margin-bottom: 8px; font-weight: 700; }
    .tool-card p { color: var(--muted); font-size: 14px; margin-bottom: 20px; flex: 1; }
    .badge {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 4px;
      background: var(--border);
      color: var(--text);
    }

    .loading { text-align: center; padding: 40px; color: var(--muted); grid-column: 1 / -1; }

    /* Footer */
    .site-footer { margin-top: auto; border-top: 1px solid var(--border); padding: 30px 0; text-align: center; color: var(--muted); font-size: 14px; }

    @media (max-width: 600px) {
      .header-inner { flex-direction: column; height: auto; padding: 16px 0; }
      .search-box { width: 100%; }
      .hero h1 { font-size: 28px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo">Letit<span>edit</span></a>
      <div class="search-box">
        <!-- width and height added directly to the SVG to prevent the giant arch bug -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchInput" placeholder="Search tools (e.g. video, text, counter)...">
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>All your tools. One place.</h1>
      <p>Fast, secure, and entirely in your browser. Your files never leave your device.</p>
    </section>

    <div class="tools-grid" id="toolsGrid">
      <div class="loading">Loading tools...</div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Letitedit. Built for the web.</p>
    </div>
  </footer>

  <script>
    async function loadTools() {
      try {
        const response = await fetch('tools.json');
        if (!response.ok) throw new Error('Network response was not ok');
        const tools = await response.json();
        renderGrid(tools);
        setupSearch(tools);
      } catch (error) {
        document.getElementById('toolsGrid').innerHTML = `
          <div class="loading">
            <h3>Could not load tools</h3>
            <p>Make sure you have a <code>tools.json</code> file in the same folder as this index.html file.</p>
          </div>
        `;
      }
    }

    function renderGrid(tools) {
      const grid = document.getElementById('toolsGrid');
      if (tools.length === 0) {
        grid.innerHTML = '<div class="loading">No tools found. Add some to tools.json!</div>';
        return;
      }
      grid.innerHTML = tools.map(tool => `
        <a href="${tool.url}" class="tool-card">
          <div class="tool-icon">${tool.icon}</div>
          <h3>${tool.name}</h3>
          <p>${tool.description}</p>
          <span class="badge">${tool.category}</span>
        </a>
      `).join('');
    }

    function setupSearch(allTools) {
      const input = document.getElementById('searchInput');
      input.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        const filtered = allTools.filter(t => 
          t.name.toLowerCase().includes(query) || 
          t.description.toLowerCase().includes(query) ||
          t.category.toLowerCase().includes(query)
        );
        renderGrid(filtered);
      });
    }

    loadTools();
  </script>
</body>
</html>
