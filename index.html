<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letitedit — Free Online Tools</title>
  <meta name="description" content="Free, fast, and private online tools. No uploads, no watermarks.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo">Letit<span>edit</span></a>
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchInput" placeholder="Search tools (e.g. video, text, counter)...">
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>All your tools. One place.</h1>
      <p>Fast, secure, and entirely in your browser. Your files never leave your device.</p>
    </section>

    <div class="tools-grid" id="toolsGrid">
      <!-- Tools are dynamically injected here via JavaScript -->
      <div class="loading">Loading tools...</div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Letitedit. Built for the web.</p>
    </div>
  </footer>

  <script>
    // Fetch the tools registry and render them
    async function loadTools() {
      try {
        const response = await fetch('tools.json');
        const tools = await response.json();
        renderGrid(tools);
        setupSearch(tools);
      } catch (error) {
        document.getElementById('toolsGrid').innerHTML = '<div class="loading">Error loading tools registry. Did you add tools.json?</div>';
      }
    }

    function renderGrid(tools) {
      const grid = document.getElementById('toolsGrid');
      grid.innerHTML = tools.map(tool => `
        <a href="${tool.url}" class="tool-card">
          <div class="tool-icon">${tool.icon}</div>
          <h3>${tool.name}</h3>
          <p>${tool.description}</p>
          <span class="badge">${tool.category}</span>
        </a>
      `).join('');
    }

    function setupSearch(allTools) {
      const input = document.getElementById('searchInput');
      input.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        const filtered = allTools.filter(t => 
          t.name.toLowerCase().includes(query) || 
          t.description.toLowerCase().includes(query) ||
          t.category.toLowerCase().includes(query)
        );
        renderGrid(filtered);
      });
    }

    loadTools();
  </script>
</body>
</html>
