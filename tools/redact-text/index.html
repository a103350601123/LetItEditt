<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Privacy Redactor Pro | LetitEdit</title>
  <meta name="description" content="Securely redact sensitive data like emails, phone numbers, names, and API keys before pasting into AI tools.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
  <link rel="stylesheet" href="../../assets/css/style.css">

  <style>
    /* =========================================
       LetitEdit Unified Layout (Redactor)
       ========================================= */
    :root {
      --brand: #6366f1;
      --brand-hover: #4f46e5;
      --brand-light: #e0e7ff;
      
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --shadow-md: 0 4px 12px rgba(0,0,0,0.05);

      /* Category Colors */
      --c-name: #2563eb; --bg-name: #dbeafe;
      --c-email: #0d9488; --bg-email: #ccfbf1;
      --c-phone: #0284c7; --bg-phone: #e0f2fe;
      --c-addr: #d97706; --bg-addr: #fef3c7;
      --c-money: #16a34a; --bg-money: #dcfce7;
      --c-id: #9333ea; --bg-id: #f3e8ff;
      --c-secret: #e11d48; --bg-secret: #ffe4e6;
      --c-net: #475569; --bg-net: #e2e8f0;
      --c-user: #ea580c; --bg-user: #ffedd5;
      --c-url: #0891b2; --bg-url: #cffafe;
      --c-date: #db2777; --bg-date: #fce7f3;
    }

    [data-theme="dark"] {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --border-color: #334155;
      /* Darker bgs for dark mode */
      --bg-name: #1e3a8a; --c-name: #93c5fd;
      --bg-email: #115e59; --c-email: #5eead4;
      --bg-phone: #075985; --c-phone: #7dd3fc;
      --bg-addr: #78350f; --c-addr: #fcd34d;
      --bg-money: #14532d; --c-money: #86efac;
      --bg-id: #4c1d95; --c-id: #d8b4fe;
      --bg-secret: #881337; --c-secret: #fda4af;
      --bg-net: #334155; --c-net: #cbd5e1;
      --bg-user: #7c2d12; --c-user: #fdba74;
      --bg-url: #164e63; --c-url: #67e8f9;
      --bg-date: #831843; --c-date: #f9a8d4;
    }

    html, body {
      height: 100%; margin: 0; padding: 0; overflow: hidden;
      background: var(--bg-color); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-main);
    }

    .app-container { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

    /* --- Top Header --- */
    .header {
      height: 64px; background: var(--card-bg); border-bottom: 1px solid var(--border-color);
      display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 100; position: relative;
    }
    .logo { font-size: 20px; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .badge { font-size: 11px; background: var(--brand-light); color: var(--brand); padding: 3px 10px; border-radius: 20px; font-weight: 700; }
    
    .nav-actions { display: flex; gap: 10px; align-items: center; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; border: none; transition: all 0.2s; font-family: inherit; }
    .btn-primary { background: var(--brand); color: white; box-shadow: 0 4px 12px rgba(99,102,241,0.3); }
    .btn-primary:hover { background: var(--brand-hover); transform: translateY(-1px); }
    .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); }
    .btn-outline:hover { background: rgba(0,0,0,0.05); }
    .btn-danger { background: #fee2e2; color: #ef4444; border: 1px solid transparent; }
    .btn-danger:hover { background: #fecaca; }

    /* --- App Body --- */
    .app-body { display: flex; flex: 1; overflow: hidden; position: relative; }

    /* --- Left Sidebar --- */
    .sidebar {
      width: 400px; height: 100%; background: var(--card-bg); border-right: 1px solid var(--border-color);
      display: flex; flex-direction: column; transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 90; box-shadow: 2px 0 10px rgba(0,0,0,0.03);
    }
    .app-body.hide-sidebar .sidebar { margin-left: -400px; }

    .sidebar-header {
      padding: 16px 20px; border-bottom: 1px solid var(--border-color);
      display: flex; align-items: center; justify-content: space-between; background: var(--card-bg);
    }
    .sidebar-header h2 { font-size: 16px; font-weight: 800; margin: 0; text-transform: uppercase; letter-spacing: 0.5px; }

    .sidebar-scroll { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .sidebar-scroll::-webkit-scrollbar { width: 6px; }
    .sidebar-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    /* Chip Grid */
    .chip-section { margin-bottom: 12px; }
    .chip-section-title { font-size: 12px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; }
    
    .chip-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600;
      border: 1px solid var(--border-color); background: transparent; color: var(--text-muted);
      cursor: pointer; transition: all 0.2s; user-select: none;
    }
    
    .chip:hover { background: rgba(0,0,0,0.02); }
    
    /* Active states per category */
    .chip.active.c-name { background: var(--bg-name); color: var(--c-name); border-color: var(--c-name); }
    .chip.active.c-email { background: var(--bg-email); color: var(--c-email); border-color: var(--c-email); }
    .chip.active.c-phone { background: var(--bg-phone); color: var(--c-phone); border-color: var(--c-phone); }
    .chip.active.c-addr { background: var(--bg-addr); color: var(--c-addr); border-color: var(--c-addr); }
    .chip.active.c-money { background: var(--bg-money); color: var(--c-money); border-color: var(--c-money); }
    .chip.active.c-id { background: var(--bg-id); color: var(--c-id); border-color: var(--c-id); }
    .chip.active.c-secret { background: var(--bg-secret); color: var(--c-secret); border-color: var(--c-secret); }
    .chip.active.c-net { background: var(--bg-net); color: var(--c-net); border-color: var(--c-net); }
    .chip.active.c-user { background: var(--bg-user); color: var(--c-user); border-color: var(--c-user); }
    .chip.active.c-url { background: var(--bg-url); color: var(--c-url); border-color: var(--c-url); }
    .chip.active.c-date { background: var(--bg-date); color: var(--c-date); border-color: var(--c-date); }

    .chip .count { font-size: 11px; background: rgba(0,0,0,0.08); padding: 0 6px; border-radius: 10px; }
    .chip.active .count { background: rgba(255,255,255,0.4); }
    [data-theme="dark"] .chip.active .count { background: rgba(0,0,0,0.4); color: #fff; }

    /* Custom Inputs */
    .field { display: flex; flex-direction: column; gap: 6px; margin-top: 16px; }
    .field label { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .field textarea {
      width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border-color);
      font-family: inherit; font-size: 14px; color: var(--text-main); outline: none; background: var(--card-bg);
      transition: border-color 0.2s; min-height: 60px; resize: vertical;
    }
    .field textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-light); }

    /* --- Right Editor Area --- */
    .main-editor { flex: 1; display: flex; flex-direction: column; position: relative; }
    
    .editor-header {
      min-height: 60px; background: var(--card-bg); border-bottom: 1px solid var(--border-color);
      display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 10; flex-wrap: wrap; gap: 10px;
    }
    
    .toggle-btn { background: var(--bg-color); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 8px; display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; color: var(--text-main); cursor: pointer; transition: all 0.2s; }
    .toggle-btn:hover { background: var(--border-color); }

    /* Split View */
    .split-view { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px; overflow: hidden; }
    
    .textarea-wrapper {
      display: flex; flex-direction: column; background: var(--card-bg); border-radius: 12px;
      box-shadow: var(--shadow-md); border: 1px solid var(--border-color); overflow: hidden;
      transition: border-color 0.2s;
    }
    .textarea-wrapper:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-light); }
    
    .textarea-header {
      padding: 12px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: var(--bg-color);
    }
    .textarea-header span { font-weight: 700; font-size: 14px; color: var(--text-main); }
    .textarea-header small { font-size: 12px; color: var(--brand); font-weight: 700; background: var(--brand-light); padding: 2px 8px; border-radius: 6px; }

    textarea {
      flex: 1; width: 100%; padding: 20px; border: none; outline: none; resize: none;
      font-family: inherit; font-size: 15px; line-height: 1.6; color: var(--text-main); background: transparent;
    }
    .output-area { background: rgba(0,0,0,0.02); color: var(--text-main); }

    .mobile-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(2px); z-index: 80; opacity: 0; pointer-events: none; transition: opacity 0.3s; }

    @media (max-width: 900px) {
      .sidebar { position: absolute; left: 0; top: 0; height: 100%; }
      .mobile-overlay.show { opacity: 1; pointer-events: auto; }
      .editor-header { padding: 12px; justify-content: center; }
      .toggle-btn span { display: none; }
      .toggle-btn { padding: 10px; }
      .split-view { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; padding: 12px; gap: 16px; }
      .nav-actions { width: 100%; justify-content: flex-end; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Top Header -->
    <header class="header">
      <a href="../../index.html" class="logo">🛡️ Privacy Redactor <span class="badge">PRO</span></a>
      <div class="nav-actions">
        <button id="themeToggle" class="btn btn-outline" aria-label="Toggle Dark Mode">🌙</button>
        <button class="btn btn-danger" onclick="clearAll()">🗑️ <span>Clear</span></button>
        <button class="btn btn-primary" onclick="copyOutput()">📋 <span>Copy Result</span></button>
      </div>
    </header>

    <div class="app-body" id="appBody">
      
      <div class="mobile-overlay" id="mobileOverlay" onclick="toggleSidebar()"></div>

      <!-- LEFT: Settings Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <h2>What to hide</h2>
          <button class="btn btn-outline" onclick="toggleSidebar()" style="padding:4px 8px;">✕</button>
        </div>
        
        <div class="sidebar-scroll">
          
          <!-- Chip Grid -->
          <div class="chip-section">
            <div class="chip-grid" id="chipGrid">
              <!-- Chips injected by JS -->
            </div>
          </div>

          <!-- Manual Words -->
          <div class="field">
            <label>Always hide these words</label>
            <textarea id="customWords" placeholder="Separate with commas..."></textarea>
          </div>

          <!-- Restoration -->
          <div class="field" style="margin-top: 24px; padding-top: 16px; border-top: 1px dashed var(--border-color);">
            <label style="color: var(--brand);">Put real values back (Restore)</label>
            <textarea id="restoreInput" placeholder="Paste AI reply here containing labels like [EMAIL_1]..."></textarea>
            <button class="btn btn-outline" style="width:100%; margin-top:8px;" onclick="restoreText()">Restore Values</button>
            <textarea id="restoreOutput" readonly placeholder="Restored text will appear here..." style="margin-top:8px; background: #e0e7ff; color: #000;"></textarea>
          </div>

        </div>
      </aside>

      <!-- RIGHT: Editor Area -->
      <main class="main-editor">
        <header class="editor-header">
          <div style="display:flex; align-items:center; gap:16px;">
            <button class="toggle-btn" onclick="toggleSidebar()">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path></svg>
              <span>Controls</span>
            </button>
          </div>
          <div class="preview-info" style="font-size:13px; font-weight:700; color:var(--text-muted);">
            Secure & Client-Side
          </div>
        </header>

        <div class="split-view">
          <!-- Input -->
          <div class="textarea-wrapper">
            <div class="textarea-header">
              <span>Original Text</span>
              <small id="inputStats">0 chars</small>
            </div>
            <textarea id="textInput" placeholder="Paste your sensitive text here..."></textarea>
          </div>

          <!-- Output -->
          <div class="textarea-wrapper">
            <div class="textarea-header">
              <span>Redacted Output</span>
              <small id="outputStats">0 chars</small>
            </div>
            <textarea id="textOutput" class="output-area" readonly placeholder="Safe text will appear here..."></textarea>
          </div>
        </div>
      </main>

    </div>
  </div>

  <script src="../../assets/js/common.js"></script>
  <script>
    // === DOM Elements ===
    const appBody = document.getElementById('appBody');
    const mobileOverlay = document.getElementById('mobileOverlay');
    const textInput = document.getElementById('textInput');
    const textOutput = document.getElementById('textOutput');
    const customWords = document.getElementById('customWords');
    const restoreInput = document.getElementById('restoreInput');
    const restoreOutput = document.getElementById('restoreOutput');
    const chipGrid = document.getElementById('chipGrid');

    // === Categories Configuration ===
    const CATEGORIES = [
      { id: 'name', label: 'Names', class: 'c-name' },
      { id: 'email', label: 'Emails', class: 'c-email' },
      { id: 'phone', label: 'Phone numbers', class: 'c-phone' },
      { id: 'addr', label: 'Addresses', class: 'c-addr' },
      { id: 'money', label: 'Cards & bank', class: 'c-money' },
      { id: 'id', label: 'SSNs & IDs', class: 'c-id' },
      { id: 'secret', label: 'Keys & passwords', class: 'c-secret' },
      { id: 'net', label: 'IP addresses', class: 'c-net' },
      { id: 'user', label: 'Usernames', class: 'c-user' },
      { id: 'url', label: 'URLs & domains', class: 'c-url' },
      { id: 'date', label: 'Dates', class: 'c-date' }
    ];

    // Active state map
    let activeCats = {};
    CATEGORIES.forEach(c => activeCats[c.id] = true); // Default all on

    // Redaction map to hold original values
    let redactionMap = {};

    // === Build Chips UI ===
    function buildChips() {
      chipGrid.innerHTML = '';
      CATEGORIES.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `chip active ${cat.class}`;
        btn.dataset.id = cat.id;
        btn.innerHTML = `<span>${cat.label}</span><span class="count" id="cnt-${cat.id}"></span>`;
        btn.onclick = () => {
          activeCats[cat.id] = !activeCats[cat.id];
          btn.classList.toggle('active', activeCats[cat.id]);
          processText();
        };
        chipGrid.appendChild(btn);
      });
    }

    // === Sidebar Toggle ===
    function toggleSidebar() {
      appBody.classList.toggle('hide-sidebar');
      if (window.innerWidth <= 900) mobileOverlay.classList.toggle('show');
    }

    // === Core Redaction Engine ===
    let debounceTimer;
    function triggerProcess() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(processText, 100);
    }

    function processText() {
      let text = textInput.value;
      redactionMap = {}; // Reset map
      
      // Reset counts
      CATEGORIES.forEach(c => document.getElementById(`cnt-${c.id}`).textContent = '');

      if (!text) {
        textOutput.value = '';
        updateStats(0);
        return;
      }

      // 1. Regex Patterns for Auto-Detection
      const patterns = {
        email: /\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b/g,
        phone: /(?:\+?\d{1,3}[-.\s]?)?\(?\d{3}\)?[-.\s]?\d{3}[-.\s]?\d{4}/g,
        money: /\b(?:\d[ -]*?){13,16}\b/g,
        id: /\b\d{3}-\d{2}-\d{4}\b/g, // SSN
        net: /\b(?:\d{1,3}\.){3}\d{1,3}\b/g, // IPv4
        url: /(https?:\/\/[^\s]+)/g,
        date: /\b(?:\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}|\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2}|(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+\d{1,2},?\s+\d{4})\b/gi,
        secret: /(?:password|passwd|pwd|secret|token|api_key|apikey)\s*[:=]\s*["']?([^"'\s]+)["']?/gi,
        addr: /\b\d{1,5}\s+(?:[A-Za-z0-9]+\s+){1,3}(?:Street|St|Avenue|Ave|Road|Rd|Boulevard|Blvd|Lane|Ln|Drive|Dr|Court|Ct|Way|Terrace|Ter|Place|Pl)\b/gi,
        user: /(?:\/Users\/|\/home\/|[Uu]ser\s*[:=]\s*)([A-Za-z0-9._-]+)/g,
        name: /\b[A-Z][a-z]+(?:\s+[A-Z][a-z]+)+\b/g // Simple heuristic: Two capitalized words
      };

      // Apply patterns
      for (const [catId, regex] of Object.entries(patterns)) {
        if (!activeCats[catId]) continue;

        text = text.replace(regex, (match, p1) => {
          // Special handling for key/value pairs (user, secret) to only redact the value, not the key
          if (catId === 'secret' || catId === 'user') {
            if (!p1) return match;
            const safeVal = maskToken(p1, catId);
            return match.replace(p1, safeVal);
          }
          
          // Don't mask if it's obviously a card number but we are processing phone
          if (catId === 'phone' && match.replace(/\D/g, '').length > 11) return match;

          // Don't mask common stop words as names
          if (catId === 'name') {
            const stopWords = ['The', 'This', 'That', 'With', 'From', 'Your', 'Dear', 'Best', 'Regards'];
            const words = match.split(/\s+/);
            if (words.some(w => stopWords.includes(w))) return match;
          }

          return maskToken(match, catId);
        });
      }

      // 2. Custom Words
      const customList = customWords.value.split(',').map(w => w.trim()).filter(w => w);
      customList.forEach(word => {
        const safeWord = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const regex = new RegExp(`\\b${safeWord}\\b`, 'gi');
        text = text.replace(regex, (match) => maskToken(match, 'term'));
      });

      textOutput.value = text;
      updateStats(text.length);
      updateCounts();
    }

    // Helper to mask text and store in map
    function maskToken(original, type) {
      // Remove punctuation from match for cleaner map keys, but preserve the punctuation in output
      // e.g., "user@email.com," -> label: "[EMAIL_1],"
      let core = original;
      let pre = '', post = '';
      const match = original.match(/^([^a-zA-Z0-9]*)(.*?)([^a-zA-Z0-9]*)$/);
      if (match) {
        pre = match[1]; core = match[2]; post = match[3];
      }

      if (!core) return original;

      // Check if this exact string is already mapped
      for (const [k, v] of Object.entries(redactionMap)) {
        if (v === core) return pre + k + post; // Reuse existing label
      }

      const count = Object.keys(redactionMap).filter(k => k.startsWith(`[${type.toUpperCase()}_`)).length + 1;
      const label = `[${type.toUpperCase()}_${count}]`;
      redactionMap[label] = core;
      
      return pre + label + post;
    }

    function updateCounts() {
      const counts = {};
      Object.keys(redactionMap).forEach(label => {
        const type = label.split('_')[0].replace('[', '').toLowerCase();
        counts[type] = (counts[type] || 0) + 1;
      });

      CATEGORIES.forEach(cat => {
        const el = document.getElementById(`cnt-${cat.id}`);
        if (counts[cat.id]) {
          el.textContent = counts[cat.id];
          el.style.display = 'inline-block';
        } else {
          el.style.display = 'none';
        }
      });
    }

    // === Restoration Engine ===
    function restoreText() {
      let text = restoreInput.value;
      if (!text) return;

      // Sort labels by length descending to prevent [EMAIL_1] replacing part of [EMAIL_10]
      const sortedLabels = Object.keys(redactionMap).sort((a, b) => b.length - a.length);
      
      for (const label of sortedLabels) {
        // Replace all occurrences of the label with the original value
        text = text.split(label).join(redactionMap[label]);
      }

      restoreOutput.value = text;
    }

    // === Utilities ===
    function updateStats(length) {
      const inLength = textInput.value.length;
      document.getElementById('inputStats').textContent = inLength + (inLength === 1 ? ' char' : ' chars');
      document.getElementById('outputStats').textContent = length + (length === 1 ? ' char' : ' chars');
    }

    function clearAll() {
      textInput.value = '';
      textOutput.value = '';
      restoreInput.value = '';
      restoreOutput.value = '';
      customWords.value = '';
      updateStats(0);
      textInput.focus();
    }

    function copyOutput() {
      if (!textOutput.value) return;
      
      navigator.clipboard.writeText(textOutput.value).then(() => {
        const btn = document.querySelector('.btn-primary');
        const originalText = btn.innerHTML;
        btn.innerHTML = "✅ Copied!";
        btn.style.background = "#10b981"; 
        
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.style.background = "";
        }, 2000);
      }).catch(err => {
        alert("Failed to copy text.");
      });
    }

    // === Event Listeners ===
    textInput.addEventListener('input', triggerProcess);
    customWords.addEventListener('input', triggerProcess);

    // Initial setup
    window.addEventListener('DOMContentLoaded', () => {
      buildChips();
      processText();
      textInput.focus();
    });
  </script>
</body>
</html>
