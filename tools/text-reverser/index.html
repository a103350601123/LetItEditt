<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Text Reverser Pro | LetitEdit</title>
  <meta name="description" content="Instantly reverse your text. Flip characters, words, or entire lines with our advanced, free online Text Reverser.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔄</text></svg>">
  <link rel="stylesheet" href="../../assets/css/style.css">

  <style>
    /* =========================================
       LetitEdit Premium Layout
       ========================================= */
    :root {
      --brand: #6366f1; /* Indigo */
      --brand-hover: #4f46e5;
      --brand-light: #e0e7ff;
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.05);
    }

    html, body {
      height: 100%; margin: 0; padding: 0; overflow: hidden;
      background: var(--bg-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .app-container { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

    /* --- Top Header --- */
    .top-nav {
      height: 64px; background: #ffffff; border-bottom: 1px solid var(--border-color);
      display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 10;
    }
    .logo { font-size: 20px; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
    .badge { font-size: 11px; background: var(--brand-light); color: var(--brand); padding: 3px 10px; border-radius: 20px; font-weight: 700; }
    .nav-actions { display: flex; gap: 10px; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; border: none; transition: all 0.2s; font-family: inherit; }
    .btn-primary { background: var(--brand); color: white; box-shadow: 0 4px 12px rgba(99,102,241,0.3); }
    .btn-primary:hover { background: var(--brand-hover); transform: translateY(-1px); }
    .btn-outline { background: #fff; border: 1px solid var(--border-color); color: var(--text-main); }
    .btn-outline:hover { background: #f8fafc; border-color: #cbd5e1; }
    .btn-danger { background: #fee2e2; color: #ef4444; border: 1px solid transparent; }
    .btn-danger:hover { background: #fecaca; }

    /* --- Control Bar (More Menu) --- */
    .control-bar {
      background: #ffffff; border-bottom: 1px solid var(--border-color);
      padding: 12px 24px; display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap;
    }
    .mode-btn {
      background: #f1f5f9; border: 1px solid transparent; color: var(--text-muted);
      padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s;
    }
    .mode-btn:hover { background: #e2e8f0; color: var(--text-main); }
    .mode-btn.active { background: var(--brand-light); color: var(--brand); border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }

    /* --- Main Editor Area --- */
    .editor-area {
      flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px; overflow: hidden;
    }
    
    .pane {
      background: #ffffff; border-radius: 12px; border: 1px solid var(--border-color);
      box-shadow: var(--shadow-md); display: flex; flex-direction: column; overflow: hidden; transition: border-color 0.2s;
    }
    .pane:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-light); }
    
    .pane-header {
      padding: 12px 20px; border-bottom: 1px solid var(--border-color); background: #f8fafc;
      display: flex; justify-content: space-between; align-items: center;
    }
    .pane-header span { font-weight: 700; font-size: 14px; color: var(--text-main); }
    .pane-stats { font-size: 12px; color: var(--text-muted); font-weight: 600; background: #e2e8f0; padding: 2px 8px; border-radius: 6px; }

    textarea {
      flex: 1; width: 100%; padding: 20px; border: none; outline: none; resize: none;
      font-family: inherit; font-size: 15px; line-height: 1.6; color: var(--text-main); background: transparent;
    }
    .output-pane textarea { background: #fafafa; color: #334155; }

    /* --- Responsive --- */
    @media (max-width: 768px) {
      .editor-area { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; padding: 12px; gap: 12px; }
      .nav-actions .btn span { display: none; }
      .nav-actions .btn { padding: 8px 12px; }
      .control-bar { padding: 12px; }
      .mode-btn { flex: 1; text-align: center; font-size: 12px; padding: 8px 6px; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Top Header -->
    <header class="top-nav">
      <div class="logo">🔄 Text Reverse <span class="badge">PRO</span></div>
      <div class="nav-actions">
        <button class="btn btn-danger" onclick="clearAll()">🗑️ <span>Clear</span></button>
        <button class="btn btn-primary" onclick="copyOutput()">📋 <span>Copy Result</span></button>
      </div>
    </header>

    <!-- Control Bar (Modes) -->
    <div class="control-bar">
      <button class="mode-btn active" onclick="setMode('chars')" id="btn-chars">Reverse Characters</button>
      <button class="mode-btn" onclick="setMode('words')" id="btn-words">Reverse Words</button>
      <button class="mode-btn" onclick="setMode('lines')" id="btn-lines">Reverse Lines</button>
      <button class="mode-btn" onclick="setMode('each-word')" id="btn-each-word">Flip Each Word</button>
    </div>

    <!-- Editor Area -->
    <main class="editor-area">
      
      <!-- Input Pane -->
      <div class="pane">
        <div class="pane-header">
          <span>Raw Input</span>
          <span class="pane-stats" id="inputStats">0 chars</span>
        </div>
        <textarea id="textInput" placeholder="Type or paste your text here to instantly reverse it..."></textarea>
      </div>

      <!-- Output Pane -->
      <div class="pane output-pane">
        <div class="pane-header">
          <span>Reversed Output</span>
          <span class="pane-stats" id="outputStats">0 chars</span>
        </div>
        <textarea id="textOutput" readonly placeholder="Reversed text will appear here..."></textarea>
      </div>

    </main>
  </div>

  <script>
    // === DOM Elements ===
    const textInput = document.getElementById('textInput');
    const textOutput = document.getElementById('textOutput');
    
    // State
    let currentMode = 'chars';

    // === Mode Switching ===
    function setMode(mode) {
      currentMode = mode;
      
      // Update UI buttons
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`btn-${mode}`).classList.add('active');
      
      // Trigger reversal with new mode
      processText();
    }

    // === Core Reversal Logic ===
    function processText() {
      const text = textInput.value;
      let result = '';

      if (!text) {
        textOutput.value = '';
        updateStats();
        return;
      }

      switch (currentMode) {
        case 'chars':
          // "Hello" -> "olleH"
          result = text.split('').reverse().join('');
          break;
          
        case 'words':
          // "Hello World" -> "World Hello"
          result = text.split(' ').reverse().join(' ');
          break;
          
        case 'lines':
          // Line 1 \n Line 2 -> Line 2 \n Line 1
          result = text.split('\n').reverse().join('\n');
          break;
          
        case 'each-word':
          // "Hello World" -> "olleH dlroW"
          result = text.split(' ').map(word => word.split('').reverse().join('')).join(' ');
          break;
      }

      textOutput.value = result;
      updateStats();
    }

    // === Utilities ===
    function updateStats() {
      const inLength = textInput.value.length;
      const outLength = textOutput.value.length;
      
      document.getElementById('inputStats').textContent = inLength + (inLength === 1 ? ' char' : ' chars');
      document.getElementById('outputStats').textContent = outLength + (outLength === 1 ? ' char' : ' chars');
    }

    function clearAll() {
      textInput.value = '';
      textOutput.value = '';
      updateStats();
      textInput.focus();
    }

    function copyOutput() {
      if (!textOutput.value) return;
      
      navigator.clipboard.writeText(textOutput.value).then(() => {
        const btn = document.querySelector('.btn-primary');
        const originalText = btn.innerHTML;
        btn.innerHTML = "✅ Copied!";
        btn.style.background = "#10b981"; // Success green
        
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.style.background = "";
        }, 2000);
      }).catch(err => {
        alert("Failed to copy text.");
      });
    }

    // === Event Listeners ===
    // Real-time processing as you type
    textInput.addEventListener('input', processText);

    // Initial setup
    window.addEventListener('DOMContentLoaded', () => {
      processText();
      textInput.focus();
    });
  </script>
</body>
</html>
