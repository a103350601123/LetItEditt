<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pro Video Editor — Letitedit</title>
<style>
  :root {
    --bg-dark: #0f0f11;
    --bg-panel: #18181b;
    --bg-hover: #27272a;
    --border: #3f3f46;
    --text-main: #f4f4f5;
    --text-muted: #a1a1aa;
    --accent: #00d2ff;
    --track-bg: #141416;
  }
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg-dark); color: var(--text-main); font-family: system-ui, -apple-system, sans-serif; font-size: 13px; }
  
  /* Scrollbars */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-thumb { background: #52525b; border-radius: 2px; }

  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  
  /* ── TOP BAR ── */
  .topbar { height: 48px; display: flex; align-items: center; padding: 0 12px; border-bottom: 1px solid var(--border); background: var(--bg-panel); gap: 12px; flex-shrink: 0; z-index: 10; }
  .logo { font-weight: 800; font-size: 16px; margin-right: auto; }
  .logo span { color: var(--accent); }
  .top-btn { background: transparent; border: none; color: var(--text-muted); padding: 6px; border-radius: 4px; cursor: pointer; }
  .top-btn.primary { background: var(--accent); color: #000; font-weight: 700; padding: 6px 12px; }

  /* ── MAIN LAYOUT ── */
  .main { display: flex; flex: 1; min-height: 0; flex-direction: row; }
  @media (max-width: 768px) {
    .main { flex-direction: column; }
  }
  
  /* Left Sidebar (Tools) */
  .sidebar-left { width: 280px; background: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; z-index: 5; }
  @media (max-width: 768px) {
    .sidebar-left { width: 100%; height: 250px; border-right: none; border-bottom: 1px solid var(--border); }
  }
  
  .panel-content { flex: 1; overflow-y: auto; padding: 10px; }
  
  /* Accordion Menu */
  .accordion-item { margin-bottom: 4px; border-radius: 4px; overflow: hidden; background: var(--bg-dark); }
  .accordion-header { padding: 10px 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: 600; color: var(--text-main); }
  .accordion-header:hover { background: var(--bg-hover); }
  .accordion-header.active { color: var(--accent); }
  .accordion-content { padding: 8px 12px; display: none; flex-wrap: wrap; gap: 6px; }
  .accordion-content.active { display: flex; flex-direction: column; }
  
  .category-title { font-size: 11px; color: var(--accent); margin: 8px 0 4px; font-weight: 600; }
  .effect-btn { background: var(--bg-hover); border: 1px solid transparent; color: var(--text-muted); padding: 6px 10px; border-radius: 4px; text-align: left; cursor: pointer; font-size: 12px; transition: 0.1s; }
  .effect-btn:hover { border-color: var(--border); color: var(--text-main); }
  .effect-btn.selected { border-color: var(--accent); color: var(--accent); background: rgba(0, 210, 255, 0.1); }

  /* Center Player */
  .player-area { flex: 1; background: #000; display: flex; flex-direction: column; position: relative; min-height: 0; }
  .canvas-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 10px; overflow: hidden; }
  #preview { max-width: 100%; max-height: 100%; box-shadow: 0 4px 20px rgba(0,0,0,0.5); background: #000; }
  
  /* PLAYER CONTROLS (FIXED) */
  .player-controls { height: 50px; background: var(--bg-panel); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; flex-shrink: 0; }
  .time-display { font-family: monospace; color: var(--accent); font-size: 12px; min-width: 80px; }
  
  /* THE PLAY BUTTON */
  #btnPlay { width: 40px; height: 40px; border-radius: 50%; background: var(--text-main); color: #000; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.1s; }
  #btnPlay:active { transform: scale(0.9); }
  #btnPlay svg { width: 20px; height: 20px; fill: currentColor; }

  /* Right Sidebar (Properties) */
  .sidebar-right { width: 300px; background: var(--bg-panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
  @media (max-width: 768px) {
    .sidebar-right { width: 100%; height: 220px; border-left: none; border-top: 1px solid var(--border); }
  }
  
  .prop-tabs { display: flex; border-bottom: 1px solid var(--border); padding: 0 10px; gap: 15px; overflow-x: auto; scrollbar-width: none; }
  .prop-tab { padding: 10px 0; color: var(--text-muted); cursor: pointer; font-weight: 500; font-size: 12px; border-bottom: 2px solid transparent; white-space: nowrap; }
  .prop-tab.active { color: var(--text-main); border-bottom-color: var(--text-main); }
  
  .prop-section { border-bottom: 1px solid var(--border); padding: 12px; }
  .prop-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .prop-label { flex: 1; font-size: 11px; color: var(--text-muted); }
  
  input[type="range"] { flex: 1; height: 4px; border-radius: 2px; background: #3f3f46; outline: none; -webkit-appearance: none; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--text-main); cursor: pointer; }
  input[type="number"], input[type="color"] { background: var(--bg-dark); border: 1px solid var(--border); color: var(--text-main); padding: 4px 6px; border-radius: 4px; font-size: 12px; outline: none; }
  input[type="color"] { padding: 0; width: 30px; height: 26px; cursor: pointer; }
  .btn-sm { background: var(--bg-hover); border: none; color: var(--text-main); padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }

  /* ── TIMELINE ── */
  .timeline-area { height: 220px; background: var(--bg-panel); border-top: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
  .timeline-toolbar { height: 36px; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 12px; gap: 8px; flex-shrink: 0; }
  .timeline-scroll { flex: 1; overflow: auto; position: relative; display: flex; }
  .track-headers { width: 80px; background: var(--bg-panel); border-right: 1px solid var(--border); z-index: 10; position: sticky; left: 0; flex-shrink: 0; }
  .track-header { height: 48px; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 8px; font-size: 11px; color: var(--text-muted); }
  
  .timeline-tracks { flex: 1; position: relative; min-width: 1000px; }
  .ruler { height: 24px; background: var(--bg-dark); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; cursor: pointer; }
  .ruler-tick { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--border); color: var(--text-muted); font-size: 9px; padding-left: 2px; line-height: 24px; pointer-events: none; }
  .track { height: 48px; border-bottom: 1px solid var(--border); position: relative; background: var(--track-bg); }
  .clip { position: absolute; top: 3px; height: 42px; background: #2b5c68; border: 1px solid #4a9baf; border-radius: 4px; overflow: hidden; cursor: grab; display: flex; flex-direction: column; }
  .clip.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .clip.audio { background: #1b4b3e; border-color: #297a63; }
  .clip.text { background: #5c4b2b; border-color: #9b824a; }
  .clip-label { font-size: 9px; padding: 2px 4px; background: rgba(0,0,0,0.4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
  .clip-strip { flex: 1; display: flex; opacity: 0.5; background-image: repeating-linear-gradient(90deg, transparent, transparent 10px, rgba(255,255,255,0.05) 10px, rgba(255,255,255,0.05) 11px); }
  .clip-handle { position: absolute; top: 0; bottom: 0; width: 8px; cursor: ew-resize; background: rgba(255,255,255,0.2); }
  .clip-handle.left { left: 0; } .clip-handle.right { right: 0; }
  
  .playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); z-index: 20; pointer-events: none; }
  .playhead::before { content: ''; position: absolute; top: 0; left: -5px; border: 6px solid transparent; border-top-color: var(--accent); }

  /* Modal */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 1000; }
  .modal.on { display: flex; }
  .modal-content { background: var(--bg-panel); padding: 24px; border-radius: 8px; width: 300px; border: 1px solid var(--border); text-align: center; }
  .spinner { width: 24px; height: 24px; border: 3px solid rgba(255,255,255,0.2); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="logo">Letit<span>edit</span></div>
    <button class="top-btn" id="btnUndo">↶</button>
    <button class="top-btn" id="btnRedo">↷</button>
    <button class="top-btn primary" id="btnExport">Export</button>
  </div>

  <div class="main">
    <!-- LEFT SIDEBAR (Tools) -->
    <div class="sidebar-left">
      <div class="panel-content">
        <div class="accordion-item">
          <div class="accordion-header active" onclick="toggleAccordion(this)">▶ Media</div>
          <div class="accordion-content active" id="mediaContent">
            <button class="effect-btn" onclick="document.getElementById('fileInput').click()">+ Import Media</button>
            <div id="mediaGrid" style="display:grid; grid-template-columns:1fr 1fr; gap:4px; margin-top:8px;"></div>
          </div>
        </div>

        <div class="accordion-item">
          <div class="accordion-header" onclick="toggleAccordion(this)">▶ Add Text</div>
          <div class="accordion-content">
            <button class="effect-btn" onclick="addTextClip('Double-click to edit', 'basic')">Basic Text</button>
            <div class="category-title">Templates</div>
            <button class="effect-btn" onclick="addTextClip('Title', 'title')">Title</button>
            <button class="effect-btn" onclick="addTextClip('Caption', 'caption')">Caption</button>
          </div>
        </div>

        <div class="accordion-item">
          <div class="accordion-header" onclick="toggleAccordion(this)">▶ Stickers</div>
          <div class="accordion-content">
            <button class="effect-btn" onclick="document.getElementById('stickerInput').click()">+ Upload Sticker</button>
            <div class="category-title">Trending</div>
            <button class="effect-btn" onclick="alert('Emoji sticker applied!')">🔥 Fire Emoji</button>
          </div>
        </div>

        <div class="accordion-item">
          <div class="accordion-header" onclick="toggleAccordion(this)">▶ Effects</div>
          <div class="accordion-content">
            <div class="category-title">Video effects</div>
            <button class="effect-btn" onclick="applyVideoEffect('glitch')">Glitch</button>
            <button class="effect-btn" onclick="applyVideoEffect('retro')">Retro</button>
            <button class="effect-btn" onclick="applyVideoEffect('lens')">Lens</button>
            
            <div class="category-title">Body effects</div>
            <button class="effect-btn" onclick="applyBodyEffect('stroke')">Stroke</button>
            <button class="effect-btn" onclick="applyBodyEffect('hallucination')">Hallucination</button>
            <button class="effect-btn" onclick="applyBodyEffect('mask')">Mask</button>
          </div>
        </div>

        <div class="accordion-item">
          <div class="accordion-header" onclick="toggleAccordion(this)">▶ Transitions</div>
          <div class="accordion-content">
            <div class="category-title">Basic</div>
            <button class="effect-btn" onclick="applyTransition('fade')">Fade</button>
            <button class="effect-btn" onclick="applyTransition('slide')">Slide</button>
            <div class="category-title">Light Effects</div>
            <button class="effect-btn" onclick="applyTransition('flash')">Flash</button>
          </div>
        </div>
      </div>
    </div>

    <!-- CENTER PLAYER -->
    <div class="player-area">
      <div class="canvas-container">
        <canvas id="preview" width="1080" height="1920"></canvas>
      </div>
      <div class="player-controls">
        <div class="time-display" id="timeDisplay">00:00:00</div>
        <!-- FIXED PLAY BUTTON -->
        <button id="btnPlay">
          <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <div class="time-display" id="timeDisplayTotal" style="text-align:right;">00:00:00</div>
      </div>
    </div>

    <!-- RIGHT SIDEBAR (Properties) -->
    <div class="sidebar-right">
      <div class="prop-tabs">
        <div class="prop-tab active">Video</div>
        <div class="prop-tab">Speed</div>
      </div>
      <div class="panel-content" id="propContent">
        <div class="prop-section">
          <div class="prop-row"><span class="prop-label">Scale</span>
            <input type="range" id="propScale" min="10" max="300" value="100">
          </div>
          <div class="prop-row"><span class="prop-label">Opacity</span>
            <input type="range" id="propOpacity" min="0" max="100" value="100">
          </div>
          <div class="prop-row"><span class="prop-label">Color Key</span>
            <input type="checkbox" id="propCutoutEnable">
            <input type="color" id="propCutoutColor" value="#00ff00">
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- TIMELINE -->
  <div class="timeline-area">
    <div class="timeline-toolbar">
      <button class="btn-sm" onclick="splitClip()">Split</button>
      <button class="btn-sm" onclick="deleteClip()">Delete</button>
    </div>
    <div class="timeline-scroll">
      <div class="track-headers">
        <div style="height:24px; border-bottom:1px solid var(--border);"></div>
        <div class="track-header">Text</div>
        <div class="track-header">Overlay</div>
        <div class="track-header">Video</div>
        <div class="track-header">Audio</div>
      </div>
      <div class="timeline-tracks" id="timelineTracks">
        <div class="ruler" id="ruler"></div>
        <div class="track" data-track="0"></div> <!-- Text -->
        <div class="track" data-track="1"></div> <!-- Overlay/Stickers -->
        <div class="track" data-track="2"></div> <!-- Video -->
        <div class="track" data-track="3"></div> <!-- Audio -->
        <div class="playhead" id="playhead"></div>
      </div>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="video/*,audio/*,image/*" multiple hidden>
<input type="file" id="stickerInput" accept="image/*" hidden>

<div class="modal" id="exportModal">
  <div class="modal-content">
    <h2>Exporting</h2>
    <div class="spinner"></div>
    <div id="exportMsg">Rendering... 0%</div>
  </div>
</div>

<script>
'use strict';
// ─── CONSTANTS & STATE ──────────────────────────────────────────────────
const TRACKS = { text: 0, overlay: 1, video: 2, audio: 3 };
const state = { media: [], clips: [], selectedId: null, currentTime: 0, playing: false, zoom: 50 };
let audioCtx = null, audioDest = null;
let canvas = document.getElementById('preview'), ctx = canvas.getContext('2d');
let hiddenCanvas = document.createElement('canvas'), hiddenCtx = hiddenCanvas.getContext('2d', { willReadFrequently: true });
let rafId = null, lastTime = 0;

const uid = () => Math.random().toString(36).slice(2, 10);
const getClip = (id) => state.clips.find(c => c.id === id);
const fmtTime = (t) => {
  const m = Math.floor(t / 60).toString().padStart(2, '0');
  const s = Math.floor(t % 60).toString().padStart(2, '0');
  const f = Math.floor((t % 1) * 30).toString().padStart(2, '0');
  return `${m}:${s}:${f}`;
};
const getTotalDuration = () => Math.max(10, ...state.clips.map(c => c.start + c.duration));

// ─── UI ACCORDION ───────────────────────────────────────────────────────
function toggleAccordion(el) {
  const content = el.nextElementSibling;
  el.classList.toggle('active');
  content.classList.toggle('active');
}

// ─── MEDIA IMPORT ───────────────────────────────────────────────────────
document.getElementById('fileInput').addEventListener('change', async (e) => {
  for (const f of Array.from(e.target.files)) {
    const url = URL.createObjectURL(f);
    const type = f.type.startsWith('video') ? 'video' : f.type.startsWith('audio') ? 'audio' : 'image';
    const m = { id: uid(), type, url, name: f.name, duration: 5, thumb: null };
    
    if (type === 'video') {
      const v = document.createElement('video'); v.src = url; v.muted = true;
      await new Promise(r => v.onloadedmetadata = r);
      m.duration = v.duration;
      v.currentTime = Math.min(1, v.duration / 2);
      await new Promise(r => v.onseeked = r);
      const c = document.createElement('canvas'); c.width = 100; c.height = 56;
      c.getContext('2d').drawImage(v, 0, 0, 100, 56);
      m.thumb = c.toDataURL();
    } else if (type === 'audio') {
      const a = document.createElement('audio'); a.src = url;
      await new Promise(r => a.onloadedmetadata = r); m.duration = a.duration;
    } else {
      m.thumb = url;
    }
    state.media.push(m);
  }
  renderMediaLibrary();
  e.target.value = '';
});

function renderMediaLibrary() {
  const grid = document.getElementById('mediaGrid');
  grid.innerHTML = state.media.map(m => `
    <div style="height:60px; background:#27272a; border-radius:4px; overflow:hidden; cursor:pointer; border:1px solid transparent;" onclick="addMediaToTimeline('${m.id}')">
      ${m.thumb ? `<img src="${m.thumb}" style="width:100%; height:100%; object-fit:cover;">` : `<div style="display:flex; align-items:center; justify-content:center; height:100%;">🎵</div>`}
    </div>
  `).join('');
}

// ─── TIMELINE & CLIPS ───────────────────────────────────────────────────
function addMediaToTimeline(mediaId) {
  const m = state.media.find(x => x.id === mediaId);
  if (!m) return;
  const track = m.type === 'audio' ? TRACKS.audio : TRACKS.video;
  addClip({
    type: m.type, mediaId: m.id, name: m.name, thumb: m.thumb,
    track, start: state.currentTime, duration: m.duration, offset: 0, speed: 1,
    transform: { scale: 100, x: 0, y: 0, opacity: 100 },
    cutout: { enabled: false, color: '#00ff00', threshold: 40 },
    filter: '', effect: ''
  });
}

function addTextClip(text, template) {
  let fontSize = 80, color = '#ffffff', stroke = '#000000', shadow = true;
  if (template === 'title') { fontSize = 120; color = '#00d2ff'; shadow = false; }
  if (template === 'caption') { fontSize = 60; stroke = '#000000'; }
  
  addClip({
    type: 'text', name: text, track: TRACKS.text, start: state.currentTime, duration: 4, offset: 0, speed: 1,
    transform: { scale: 100, x: 0, y: 0, opacity: 100 },
    textStyle: { text, fontSize, color, stroke, shadow }
  });
}

function addClip(data) {
  const c = { id: uid(), ...data, _el: null, _audioNode: null };
  ensureElement(c);
  state.clips.push(c);
  state.selectedId = c.id;
  renderTimeline(); drawFrame();
}

function ensureElement(c) {
  if (c._el || c.type === 'text') return;
  const m = state.media.find(x => x.id === c.mediaId);
  if (!m) return;
  
  if (c.type === 'video') { c._el = document.createElement('video'); c._el.src = m.url; c._el.playsInline = true; c._el.preload = 'auto'; }
  else if (c.type === 'audio') { c._el = document.createElement('audio'); c._el.src = m.url; c._el.preload = 'auto'; }
  else { c._el = new Image(); c._el.src = m.url; }
  
  if (c.type === 'video' || c.type === 'audio') {
    try {
      if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); audioDest = audioCtx.createMediaStreamDestination(); }
      const src = audioCtx.createMediaElementSource(c._el), gain = audioCtx.createGain();
      src.connect(gain); gain.connect(audioCtx.destination); gain.connect(audioDest);
      c._audioNode = { source: src, gain };
    } catch(e) {}
  }
}

// ─── RENDER TIMELINE ────────────────────────────────────────────────────
function renderTimeline() {
  const total = getTotalDuration(), width = total * state.zoom + 200;
  const tracksEl = document.getElementById('timelineTracks');
  const ruler = document.getElementById('ruler');
  
  tracksEl.style.width = width + 'px';
  ruler.innerHTML = '';
  
  for (let t = 0; t <= total + 5; t += 2) {
    const d = document.createElement('div'); d.className = 'ruler-tick';
    d.style.left = (t * state.zoom) + 'px'; d.textContent = fmtTime(t).substring(0, 5);
    ruler.appendChild(d);
  }
  
  document.querySelectorAll('.track').forEach(t => t.innerHTML = '');
  
  state.clips.forEach(c => {
    const trackEl = document.querySelector(`.track[data-track="${c.track}"]`);
    if (!trackEl) return;
    const el = document.createElement('div');
    el.className = `clip ${c.type === 'audio' ? 'audio' : c.type === 'text' ? 'text' : ''} ${state.selectedId === c.id ? 'selected' : ''}`;
    el.style.left = (c.start * state.zoom) + 'px';
    el.style.width = Math.max(c.duration * state.zoom, 20) + 'px';
    el.innerHTML = `<div class="clip-label">${c.name}</div><div class="clip-strip" style="${c.thumb ? `background-image:url(${c.thumb});background-size:cover;` : ''}"></div>`;
    el.onclick = (e) => { e.stopPropagation(); selectClip(c.id); };
    
    const hL = document.createElement('div'); hL.className = 'clip-handle left';
    const hR = document.createElement('div'); hR.className = 'clip-handle right';
    el.appendChild(hL); el.appendChild(hR);
    
    trackEl.appendChild(el);
  });
  updatePlayhead();
}

function selectClip(id) { state.selectedId = id; renderTimeline(); renderProps(); drawFrame(); }

// ─── CANVAS DRAWING & EFFECTS ───────────────────────────────────────────
function drawFrame() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  const t = state.currentTime;
  
  state.clips.filter(c => t >= c.start && t < c.start + c.duration).sort((a,b) => a.track - b.track).forEach(c => {
    const localT = t - c.start;
    
    if (c._el && (c.type === 'video' || c.type === 'audio')) {
      const expected = c.offset + (localT * c.speed);
      if (state.playing) {
        if (c._el.paused) { c._el.currentTime = expected; c._el.playbackRate = c.speed; c._el.play().catch(()=>{}); }
        if (c._audioNode) c._audioNode.gain.gain.value = 1;
      } else {
        if (!c._el.paused) c._el.pause();
        if (Math.abs(c._el.currentTime - expected) > 0.05) c._el.currentTime = expected;
      }
    }
    
    ctx.save();
    ctx.globalAlpha = c.transform.opacity / 100;
    ctx.translate(canvas.width/2 + c.transform.x, canvas.height/2 + c.transform.y);
    const scale = c.transform.scale / 100; ctx.scale(scale, scale);
    
    if (c.filter) ctx.filter = c.filter;
    
    // Specific Effects Logic
    if (c.effect === 'glitch') {
      ctx.filter = 'hue-rotate(90deg) contrast(200%)';
      ctx.drawImage(c._el || hiddenCanvas, -50, -50); // Offset for glitch feel
    } else if (c.effect === 'retro') {
      ctx.filter = 'sepia(0.8) contrast(1.2)';
    } else if (c.effect === 'hallucination') {
      ctx.filter = 'hue-rotate(180deg) saturate(300%) blur(2px)';
    }
    
    if (c.type === 'video' || c.type === 'image') {
      if (c._el && (c.type === 'image' || c._el.readyState >= 2)) {
        
        // Cutout
        if (c.cutout.enabled) {
          const vw = c._el.videoWidth || c._el.naturalWidth, vh = c._el.videoHeight || c._el.naturalHeight;
          hiddenCanvas.width = vw; hiddenCanvas.height = vh; hiddenCtx.drawImage(c._el, 0, 0);
          try {
            const img = hiddenCtx.getImageData(0, 0, vw, vh), d = img.data;
            const rC = parseInt(c.cutout.color.slice(1,3), 16), gC = parseInt(c.cutout.color.slice(3,5), 16), bC = parseInt(c.cutout.color.slice(5,7), 16);
            for (let i=0; i<d.length; i+=4) {
              if (Math.sqrt(Math.pow(d[i]-rC,2)+Math.pow(d[i+1]-gC,2)+Math.pow(d[i+2]-bC,2)) < 40) d[i+3] = 0;
            }
            hiddenCtx.putImageData(img, 0, 0);
            const sc = Math.min(canvas.width/vw, canvas.height/vh);
            ctx.drawImage(hiddenCanvas, -(vw*sc)/2, -(vh*sc)/2, vw*sc, vh*sc);
          } catch(e) {
            const sc = Math.min(canvas.width/vw, canvas.height/vh);
            ctx.drawImage(c._el, -(vw*sc)/2, -(vh*sc)/2, vw*sc, vh*sc);
          }
        } else {
          const vw = c._el.videoWidth || c._el.naturalWidth, vh = c._el.videoHeight || c._el.naturalHeight;
          const sc = Math.min(canvas.width/vw, canvas.height/vh);
          ctx.drawImage(c._el, -(vw*sc)/2, -(vh*sc)/2, vw*sc, vh*sc);
        }
      }
    } else if (c.type === 'text') {
      ctx.fillStyle = c.textStyle.color;
      ctx.font = `bold ${c.textStyle.fontSize}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      if (c.textStyle.shadow) { ctx.shadowColor = 'black'; ctx.shadowBlur = 10; }
      if (c.textStyle.stroke) { ctx.lineWidth = 8; ctx.strokeStyle = c.textStyle.stroke; ctx.strokeText(c.textStyle.text, 0, 0); }
      ctx.fillText(c.textStyle.text, 0, 0);
    }
    ctx.restore();
  });
}

// ─── EFFECTS APPLY ──────────────────────────────────────────────────────
function applyVideoEffect(type) {
  const c = getClip(state.selectedId);
  if (c) { c.effect = type; drawFrame(); }
}
function applyBodyEffect(type) {
  const c = getClip(state.selectedId);
  if (c) { 
    c.effect = type; 
    if (type === 'stroke') c.filter = 'drop-shadow(0 0 10px #00d2ff)'; 
    drawFrame(); 
  }
}
function applyTransition(type) { alert(`${type} transition queued for next cut.`); }

// ─── PROPERTIES BINDING ─────────────────────────────────────────────────
function renderProps() {
  const c = getClip(state.selectedId);
  document.getElementById('propScale').value = c?.transform.scale || 100;
  document.getElementById('propOpacity').value = c?.transform.opacity || 100;
  document.getElementById('propCutoutEnable').checked = c?.cutout.enabled || false;
}

document.getElementById('propScale').addEventListener('input', e => { const c = getClip(state.selectedId); if(c) { c.transform.scale = parseInt(e.target.value); drawFrame(); } });
document.getElementById('propOpacity').addEventListener('input', e => { const c = getClip(state.selectedId); if(c) { c.transform.opacity = parseInt(e.target.value); drawFrame(); } });
document.getElementById('propCutoutEnable').addEventListener('change', e => { const c = getClip(state.selectedId); if(c) { c.cutout.enabled = e.target.checked; drawFrame(); } });

// ─── PLAYBACK & TIMELINE SCRUB ──────────────────────────────────────────
const playBtn = document.getElementById('btnPlay'), playIcon = document.getElementById('playIcon');
function play() {
  if (state.playing) return;
  state.playing = true;
  playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; // Pause icon
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  lastTime = performance.now();
  rafId = requestAnimationFrame(tick);
}
function pause() {
  state.playing = false;
  playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>'; // Play icon
  cancelAnimationFrame(rafId);
  state.clips.forEach(c => { if(c._el && c._el.pause) c._el.pause(); });
}
function tick() {
  if (!state.playing) return;
  const now = performance.now();
  state.currentTime += (now - lastTime) / 1000;
  lastTime = now;
  if (state.currentTime > getTotalDuration()) { state.currentTime = getTotalDuration(); pause(); }
  updatePlayhead(); drawFrame();
  rafId = requestAnimationFrame(tick);
}
playBtn.addEventListener('click', () => state.playing ? pause() : play());

function updatePlayhead() {
  document.getElementById('playhead').style.left = (state.currentTime * state.zoom) + 'px';
  document.getElementById('timeDisplay').textContent = fmtTime(state.currentTime);
  document.getElementById('timeDisplayTotal').textContent = fmtTime(getTotalDuration());
}

document.getElementById('ruler').addEventListener('pointerdown', e => {
  const rect = e.target.getBoundingClientRect();
  state.currentTime = Math.max(0, (e.clientX - rect.left) / state.zoom);
  updatePlayhead(); drawFrame();
});

// ─── EXPORT ─────────────────────────────────────────────────────────────
document.getElementById('btnExport').addEventListener('click', async () => {
  if (!state.clips.length) return alert('Add media first');
  if (state.playing) pause();
  document.getElementById('exportModal').classList.add('on');
  try {
    const stream = canvas.captureStream(30);
    if (audioDest) audioDest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
    const rec = new MediaRecorder(stream, { mimeType: 'video/webm' });
    const chunks = []; rec.ondataavailable = e => chunks.push(e.data);
    const done = new Promise(r => rec.onstop = r);
    
    state.currentTime = 0; drawFrame(); rec.start();
    const total = getTotalDuration(), start = performance.now();
    
    await new Promise(resolve => {
      const loop = () => {
        state.currentTime = Math.min((performance.now() - start) / 1000, total);
        drawFrame();
        document.getElementById('exportMsg').textContent = `Rendering... ${Math.round((state.currentTime/total)*100)}%`;
        if (state.currentTime >= total) resolve(); else requestAnimationFrame(loop);
      }; requestAnimationFrame(loop);
    });
    
    rec.stop(); await done;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
    a.download = 'export.webm'; a.click();
  } catch(e) { alert(e.message); }
  finally { document.getElementById('exportModal').classList.remove('on'); }
});

// Init
renderTimeline(); drawFrame();
</script>
