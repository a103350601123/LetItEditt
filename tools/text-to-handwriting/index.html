<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Text to Handwriting Converter | LetitEdit</title>
  <meta name="description" content="Convert typed text into realistic handwritten pages. Choose from 50+ fonts, paper styles, and download as PNG, JPG, WEBP, or PDF.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✍️</text></svg>">
  <link rel="stylesheet" href="../../assets/css/style.css">
  
  <!-- Massive Google Fonts List (50+ Handwriting/Cursive Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Allura&family=Amatic+SC:wght@400;700&family=Architects+Daughter&family=Birthstone&family=Caveat:wght@400;700&family=Cedarville+Cursive&family=Coming+Soon&family=Cookie&family=Courgette&family=Covered+By+Your+Grace&family=Crafty+Girls&family=Cute+Font&family=Dancing+Script:wght@400;700&family=Dawning+of+a+New+Day&family=Delius&family=Give+You+Glory&family=Gloria+Hallelujah&family=Gochi+Hand&family=Great+Vibes&family=Handlee&family=Herr+Von+Muellerhoff&family=Homemade+Apple&family=Indie+Flower&family=Just+Another+Hand&family=Kalam:wght@300;400;700&family=Kaushan+Script&family=Kristi&family=La+Belle+Aurore&family=Marck+Script&family=Mountains+of+Christmas&family=Mr+Dafoe&family=Nanum+Pen+Script&family=Neucha&family=Nothing+You+Could+Do&family=Pacifico&family=Pangolin&family=Parisienne&family=Patrick+Hand&family=Permanent+Marker&family=Pinyon+Script&family=Qwigley&family=Reenie+Beanie&family=Rock+Salt&family=Sacramento&family=Satisfy&family=Shadows+Into+Light&family=Short+Stack&family=Sriracha&family=Style+Script&family=Tangerine:wght@400;700&family=Walter+Turncoat&family=WindSong:wght@400;500&family=Yellowtail&family=Zeyada&display=swap" rel="stylesheet">
  
  <!-- jsPDF for PDF Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    /* =========================================
       LetitEdit App Layout
       ========================================= */
    html, body {
      height: 100%; margin: 0; padding: 0; overflow: hidden;
      background: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .app-container { display: flex; height: 100vh; width: 100vw; position: relative; }

    /* --- Left Sidebar (Editing Panel) --- */
    .sidebar {
      width: 400px; height: 100%; background: #ffffff; border-right: 1px solid #e2e8f0;
      display: flex; flex-direction: column; transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 100; box-shadow: 2px 0 10px rgba(0,0,0,0.03);
    }
    .app-container.hide-sidebar .sidebar { margin-left: -400px; }

    .sidebar-header {
      padding: 16px 20px; border-bottom: 1px solid #e2e8f0;
      display: flex; align-items: center; justify-content: space-between; background: #ffffff;
    }
    .sidebar-header h2 { font-size: 18px; font-weight: 800; color: #0f172a; margin: 0; display: flex; align-items: center; gap: 8px; }

    .sidebar-scroll {
      flex: 1; overflow-y: auto; padding: 20px;
      display: flex; flex-direction: column; gap: 24px; scrollbar-width: thin;
    }
    .sidebar-scroll::-webkit-scrollbar { width: 6px; }
    .sidebar-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    /* Sections */
    .control-group { display: flex; flex-direction: column; gap: 12px; }
    .control-title {
      font-size: 12px; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px;
      display: flex; align-items: center; gap: 6px; margin: 0;
    }

    /* Inputs */
    .field label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
    .input-box, .textarea-box {
      width: 100%; font-family: inherit; font-size: 14px; color: #0f172a;
      background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; 
      padding: 10px 12px; outline: none; transition: all 0.2s;
    }
    .input-box:focus, .textarea-box:focus { background: #fff; border-color: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,0.15); }
    .textarea-box { min-height: 100px; resize: vertical; line-height: 1.5; }

    /* Font Grid */
    .font-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-height: 250px; overflow-y: auto; padding-right: 4px; }
    .font-grid::-webkit-scrollbar { width: 4px; }
    .font-grid::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    
    .font-btn {
      background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px;
      padding: 8px; text-align: left; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column;
    }
    .font-btn:hover { background: #fff; border-color: #10b981; }
    .font-btn.on { background: #ecfdf5; border-color: #10b981; box-shadow: 0 0 0 1px #10b981; }
    .font-preview { font-size: 18px; color: #0f172a; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .font-name { font-size: 9px; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Paper & Ink Settings */
    .ink-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
    .ink-btn { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #cbd5e1; cursor: pointer; padding: 0; transition: transform 0.2s; }
    .ink-btn:hover { transform: scale(1.15); }
    .ink-btn.on { box-shadow: 0 0 0 2px #10b981; transform: scale(1.15); }
    .custom-ink { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #64748b; cursor: pointer; }
    .custom-ink input[type="color"] { width: 28px; height: 28px; border: none; border-radius: 50%; cursor: pointer; padding: 0; background: none; }

    .dropdown-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .dropdown-grid .field { margin: 0; }
    .dropdown-grid select { width: 100%; font-size: 13px; padding: 8px; text-overflow: ellipsis; }

    /* Sliders */
    .slider-group { display: flex; flex-direction: column; gap: 14px; }
    .slider-item { display: flex; flex-direction: column; gap: 6px; }
    .slider-header { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: #334155; }
    .slider-header output { color: #10b981; background: #ecfdf5; padding: 2px 6px; border-radius: 4px; font-size: 12px; font-weight: 800; }
    
    input[type="range"] { -webkit-appearance: none; width: 100%; height: 6px; background: #e2e8f0; border-radius: 4px; outline: none; margin: 4px 0; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #10b981; cursor: pointer; border: 2px solid #fff; box-shadow: 0 2px 4px rgba(16,185,129,0.4); transition: transform 0.1s; }
    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }
    input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #10b981; cursor: pointer; border: 2px solid #fff; box-shadow: 0 2px 4px rgba(16,185,129,0.4); }

    .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #334155; cursor: pointer; margin-top: 4px; }
    .checkbox-row input { width: 16px; height: 16px; accent-color: #10b981; }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-family: inherit; font-weight: 700; cursor: pointer; transition: all 0.2s; border-radius: 8px; border: none; }
    .btn-outline { background: #fff; border: 1px solid #e2e8f0; color: #334155; padding: 8px 12px; font-size: 13px; }
    .btn-outline:hover { background: #f8fafc; border-color: #cbd5e1; }
    .btn-soft { background: #ecfdf5; color: #059669; padding: 8px 12px; font-size: 13px; border: 1px solid transparent; }
    .btn-soft:hover { background: #d1fae5; }
    .action-row { display: flex; gap: 8px; margin-top: 8px; }

    /* --- Right Sidebar (Preview) --- */
    .main-preview { flex: 1; display: flex; flex-direction: column; background: #e2e8f0; position: relative; overflow: hidden; }

    .preview-header {
      min-height: 60px; background: #fff; border-bottom: 1px solid #e2e8f0;
      display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 10; flex-wrap: wrap; gap: 10px;
    }
    
    .toggle-btn { background: #f1f5f9; border: 1px solid #e2e8f0; padding: 8px 16px; border-radius: 8px; display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; color: #334155; cursor: pointer; transition: all 0.2s; }
    .toggle-btn:hover { background: #e2e8f0; }

    .download-actions { display: flex; gap: 8px; align-items: center; }
    .select-format { padding: 8px; border-radius: 8px; border: 1px solid #cbd5e1; font-weight: 600; color: #334155; outline: none; background: #fff; cursor: pointer; }
    
    .btn-save { background: #fff; border: 1px solid #e2e8f0; color: #0f172a; padding: 8px 16px; font-size: 14px; }
    .btn-save:hover { background: #f8fafc; }
    .btn-pdf { background: #10b981; color: #fff; padding: 8px 16px; font-size: 14px; box-shadow: 0 4px 12px rgba(16,185,129,0.3); }
    .btn-pdf:hover { background: #059669; transform: translateY(-1px); }

    .canvas-container { flex: 1; overflow: auto; padding: 30px; display: flex; align-items: center; justify-content: center; }
    .canvas-wrapper { width: 100%; max-width: 700px; filter: drop-shadow(0 15px 25px rgba(0,0,0,0.1)); }
    .canvas-wrapper canvas { display: block; width: 100%; height: auto; border-radius: 4px; }

    .preview-info { font-size: 13px; color: #64748b; font-weight: 600; display: flex; gap: 12px; }
    .preview-info span { background: #f1f5f9; padding: 2px 8px; border-radius: 6px; }

    .mobile-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(2px); z-index: 90; opacity: 0; pointer-events: none; transition: opacity 0.3s; }

    @media (max-width: 900px) {
      .sidebar { position: absolute; left: 0; top: 0; height: 100%; box-shadow: 5px 0 25px rgba(0,0,0,0.1); }
      .app-container.hide-sidebar .sidebar { margin-left: -400px; }
      .mobile-overlay.show { opacity: 1; pointer-events: auto; }
      .preview-header { padding: 10px; justify-content: center; }
      .preview-info { display: none; }
      .toggle-btn span { display: none; }
      .toggle-btn { padding: 8px 10px; }
      .canvas-container { padding: 12px; }
      .download-actions { width: 100%; justify-content: space-between; }
    }
  </style>
</head>
<body>

  <!-- REMOVED 'hide-sidebar' class so it is visible by default -->
  <div class="app-container" id="appLayout">
    
    <div class="mobile-overlay" id="mobileOverlay" onclick="toggleSidebar()"></div>

    <!-- LEFT: Editing Panel -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>LetitEdit <span style="font-size:12px; color:#10b981; background:#ecfdf5; padding:2px 8px; border-radius:4px; margin-left:8px;">Pro</span></h2>
        <button class="btn btn-outline" onclick="toggleSidebar()" style="padding:6px 8px;">✕</button>
      </div>
      
      <div class="sidebar-scroll">
        
        <!-- Text Input -->
        <div class="control-group">
          <div class="control-title">Text Input</div>
          <div class="field">
            <label>Title (Optional)</label>
            <input type="text" id="inputTitle" class="input-box" placeholder="e.g. Chapter 1">
          </div>
          <div class="field">
            <label>Your Text</label>
            <textarea id="inputText" class="textarea-box" placeholder="Type or paste your text here..."></textarea>
          </div>
          <div class="action-row">
            <button class="btn btn-outline" style="flex:1;" onclick="useSampleText()">Sample</button>
            <button class="btn btn-outline" style="flex:1;" onclick="clearText()">Clear</button>
          </div>
        </div>

        <!-- Handwriting Font -->
        <div class="control-group">
          <div class="control-title">Handwriting Style (50+)</div>
          <div class="font-grid" id="fontGrid">
            <!-- JS Injects Fonts -->
          </div>
          <label class="btn btn-outline" style="margin-top:4px; width:100%;">
            ⬆ Write in your own font <input type="file" id="fontUpload" accept=".ttf,.otf,.woff" hidden>
          </label>
        </div>

        <!-- Paper & Ink -->
        <div class="control-group">
          <div class="control-title">Paper & Ink</div>
          
          <!-- Ink Colors -->
          <div class="ink-row" id="inkRow">
            <!-- JS Injects Inks -->
            <label class="custom-ink" title="Custom Color">
              <input type="color" id="customInk" value="#1E1E26"> Custom
            </label>
          </div>

          <!-- Dropdowns -->
          <div class="dropdown-grid">
            <div class="field">
              <label>Style</label>
              <select id="paperStyle" class="input-box">
                <option value="ruled">Ruled</option>
                <option value="plain">Plain</option>
                <option value="grid">Grid</option>
                <option value="legal">Legal</option>
                <option value="dotted">Dotted</option>
                <option value="music">Music</option>
                <option value="vintage">Vintage</option>
                <option value="dark">Dark</option>
              </select>
            </div>
            <div class="field">
              <label>Size</label>
              <select id="pageSize" class="input-box">
                <option value="a3">A3</option>
                <option value="a4" selected>A4</option>
                <option value="a5">A5</option>
                <option value="letter">US Letter</option>
                <option value="legal">US Legal</option>
              </select>
            </div>
            <div class="field">
              <label>Effect</label>
              <select id="pageEffect" class="input-box">
                <option value="clean">Clean</option>
                <option value="scan">Scanned</option>
                <option value="photo">Photo</option>
                <option value="sepia">Sepia</option>
                <option value="bw">Black & White</option>
                <option value="vintage">Vintage</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Fine-Tune -->
        <div class="control-group">
          <div class="control-title">Fine-Tune</div>
          <div class="slider-group">
            <div class="slider-item">
              <div class="slider-header"><label>Font Size</label><output id="valSize">34px</output></div>
              <input type="range" id="rangeSize" min="18" max="64" value="34">
            </div>
            <div class="slider-item">
              <div class="slider-header"><label>Line Spacing</label><output id="valGap">56px</output></div>
              <input type="range" id="rangeGap" min="36" max="96" value="56">
            </div>
            <div class="slider-item">
              <div class="slider-header"><label>Natural Variation</label><output id="valMess">4/10</output></div>
              <input type="range" id="rangeMess" min="0" max="10" value="4">
            </div>
          </div>
          <label class="checkbox-row">
            <input type="checkbox" id="chkIndent"> Indent paragraphs
          </label>
          <div class="action-row" style="margin-top:12px;">
            <button class="btn btn-soft" style="flex:1;" onclick="shuffleDesign()">🎲 Shuffle</button>
            <button class="btn btn-outline" style="flex:1;" onclick="resetDesign()">↺ Reset</button>
          </div>
        </div>

      </div>
    </aside>

    <!-- RIGHT: Preview Area -->
    <main class="main-preview">
      <header class="preview-header">
        <div style="display:flex; align-items:center; gap:16px;">
          <button class="toggle-btn" onclick="toggleSidebar()">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            <span>Controls</span>
          </button>
          <div class="preview-info">
            <span id="infoPages">1 page</span>
            <span id="infoSize">A4</span>
          </div>
        </div>
        
        <div class="download-actions">
          <select id="imageFormat" class="select-format">
            <option value="png">PNG</option>
            <option value="jpeg">JPG</option>
            <option value="webp">WEBP</option>
          </select>
          <button class="btn btn-save" onclick="downloadImage()">⬇ Save</button>
          <button class="btn btn-pdf" onclick="downloadPDF()">⬇ PDF</button>
        </div>
      </header>

      <div class="canvas-container">
        <div class="canvas-wrapper" id="canvasWrapper">
          <!-- Canvases inject here -->
        </div>
      </div>
    </main>

  </div>

  <script>
    // === State ===
    const state = {
      title: "The Water Cycle",
      text: "Water is always on the move. The sun heats oceans, lakes and rivers, and some of that water turns into vapor that rises into the air. This step is called evaporation.\n\nAs the vapor rises, it cools and turns back into tiny droplets that form clouds. This is called condensation. When the droplets join together and get too heavy, they fall back to the ground as rain, snow, sleet or hail. We call this precipitation.",
      font: 'Caveat',
      paper: 'ruled',
      ink: '#1C3F94',
      custom: '#1E1E26',
      page: 'a4',
      effect: 'clean',
      size: 34,
      gap: 56,
      mess: 4,
      indent: false,
      seed: 1
    };

    const FONTS = [
      'Alex Brush', 'Allura', 'Amatic SC', 'Architects Daughter', 'Birthstone', 'Caveat', 
      'Cedarville Cursive', 'Coming Soon', 'Cookie', 'Courgette', 'Covered By Your Grace', 
      'Crafty Girls', 'Cute Font', 'Dancing Script', 'Dawning of a New Day', 'Delius', 
      'Give You Glory', 'Gloria Hallelujah', 'Gochi Hand', 'Great Vibes', 'Handlee', 
      'Herr Von Muellerhoff', 'Homemade Apple', 'Indie Flower', 'Just Another Hand', 'Kalam', 
      'Kaushan Script', 'Kristi', 'La Belle Aurore', 'Marck Script', 'Mountains of Christmas', 
      'Mr Dafoe', 'Nanum Pen Script', 'Neucha', 'Nothing You Could Do', 'Pacifico', 'Pangolin', 
      'Parisienne', 'Patrick Hand', 'Permanent Marker', 'Pinyon Script', 'Qwigley', 
      'Reenie Beanie', 'Rock Salt', 'Sacramento', 'Satisfy', 'Shadows Into Light', 
      'Short Stack', 'Sriracha', 'Style Script', 'Tangerine', 'Walter Turncoat', 'WindSong', 
      'Yellowtail', 'Zeyada'
    ];

    const INKS = [
      { id: 'blue', c: '#1C3F94' },
      { id: 'black', c: '#1E1E26' },
      { id: 'red', c: '#C3262F' },
      { id: 'green', c: '#1D7A43' },
      { id: 'pencil', c: '#404046' },
      { id: 'white', c: '#FFFFFF' }
    ];

    const SIZES = {
      a3: { w: 1754, h: 2480, pw: 841.89, ph: 1190.55, label: 'A3' },
      a4: { w: 1240, h: 1754, pw: 595.28, ph: 841.89, label: 'A4' },
      a5: { w: 874, h: 1240, pw: 419.53, ph: 595.28, label: 'A5' },
      letter: { w: 1275, h: 1650, pw: 612, ph: 792, label: 'US Letter' },
      legal: { w: 1275, h: 2100, pw: 612, ph: 1008, label: 'US Legal' }
    };

    let customFamily = '';
    let customCount = 0;
    let pageCanvases = [];

    // === DOM Elements ===
    const appLayout = document.getElementById('appLayout');
    const mobileOverlay = document.getElementById('mobileOverlay');
    const inputTitle = document.getElementById('inputTitle');
    const inputText = document.getElementById('inputText');
    const fontGrid = document.getElementById('fontGrid');
    const inkRow = document.getElementById('inkRow');
    const customInk = document.getElementById('customInk');
    const canvasWrapper = document.getElementById('canvasWrapper');
    
    const paperStyleEl = document.getElementById('paperStyle');
    const pageSizeEl = document.getElementById('pageSize');
    const pageEffectEl = document.getElementById('pageEffect');

    // === Helpers ===
    function toggleSidebar() {
      appLayout.classList.toggle('hide-sidebar');
      if (window.innerWidth <= 900) mobileOverlay.classList.toggle('show');
    }

    function mulberry32(a) {
      return function() {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        var t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      }
    }

    function hexA(hex, a) {
      var h = String(hex || '#000000').replace('#', '');
      if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
      var n = parseInt(h, 16) || 0;
      return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')';
    }

    // === UI Initialization ===
    function initUI() {
      inputTitle.value = state.title;
      inputText.value = state.text;
      customInk.value = state.custom;
      
      // Build Fonts
      FONTS.forEach(f => {
        let b = document.createElement('button');
        b.className = 'font-btn' + (state.font === f ? ' on' : '');
        b.dataset.id = f;
        b.innerHTML = `<span class="font-preview" style="font-family:'${f}', cursive;">Hello</span><span class="font-name">${f}</span>`;
        b.onclick = () => { state.font = f; syncUI(); render(); };
        fontGrid.appendChild(b);
      });

      // Build Inks
      INKS.forEach(k => {
        let b = document.createElement('button');
        b.className = 'ink-btn' + (state.ink === k.c ? ' on' : '');
        b.dataset.id = k.id;
        b.dataset.c = k.c;
        b.style.background = k.c;
        b.style.borderColor = k.id === 'white' ? '#cbd5e1' : '#fff';
        b.onclick = () => { state.ink = k.c; syncUI(); render(); };
        inkRow.insertBefore(b, customInk.parentElement);
      });

      // Event Listeners
      inputTitle.addEventListener('input', (e) => { state.title = e.target.value; render(); });
      inputText.addEventListener('input', (e) => { state.text = e.target.value; render(); });
      customInk.addEventListener('input', (e) => { state.ink = e.target.value; syncUI(); render(); });
      
      paperStyleEl.addEventListener('change', (e) => { state.paper = e.target.value; render(); });
      pageSizeEl.addEventListener('change', (e) => { state.page = e.target.value; render(); });
      pageEffectEl.addEventListener('change', (e) => { state.effect = e.target.value; render(); });
      
      const setupSlider = (id, stateKey, unit) => {
        const el = document.getElementById('range' + id);
        const out = document.getElementById('val' + id);
        el.addEventListener('input', (e) => {
          state[stateKey] = parseFloat(e.target.value);
          out.textContent = state[stateKey] + unit;
          render();
        });
      };
      setupSlider('Size', 'size', 'px');
      setupSlider('Gap', 'gap', 'px');
      setupSlider('Mess', 'mess', '/10');

      document.getElementById('chkIndent').addEventListener('change', (e) => { state.indent = e.target.checked; render(); });

      // Font Upload
      document.getElementById('fontUpload').addEventListener('change', function() {
        const f = this.files[0];
        if (!f) return;
        this.value = '';
        
        f.arrayBuffer().then(buf => {
          const fam = 'CustomFont' + (++customCount);
          return new FontFace(fam, buf).load().then(face => {
            document.fonts.add(face);
            customFamily = fam;
            
            let b = document.createElement('button');
            b.className = 'font-btn on';
            b.dataset.id = 'custom';
            b.innerHTML = `<span class="font-preview" style="font-family:'${fam}', cursive;">Hello</span><span class="font-name">Your Font</span>`;
            b.onclick = () => { state.font = 'custom'; syncUI(); render(); };
            
            let old = fontGrid.querySelector('[data-id="custom"]');
            if (old) fontGrid.replaceChild(b, old);
            else fontGrid.insertBefore(b, fontGrid.firstChild);
            
            state.font = 'custom';
            syncUI(); render();
          });
        }).catch(() => alert('Could not read font file.'));
      });

      render();
    }

    function syncUI() {
      document.querySelectorAll('.font-btn').forEach(el => el.classList.toggle('on', el.dataset.id === state.font));
      document.querySelectorAll('.ink-btn').forEach(el => {
        el.classList.toggle('on', el.dataset.c === state.ink);
        el.style.borderColor = el.dataset.id === 'white' ? '#cbd5e1' : '#fff';
      });
      customInk.parentElement.classList.toggle('on', !INKS.some(k => k.c === state.ink));
      
      paperStyleEl.value = state.paper;
      pageSizeEl.value = state.page;
      pageEffectEl.value = state.effect;
    }

    function useSampleText() {
      inputTitle.value = "The Water Cycle";
      inputText.value = "Water is always on the move. The sun heats oceans, lakes and rivers, and some of that water turns into vapor that rises into the air. This step is called evaporation.\n\nAs the vapor rises, it cools and turns back into tiny droplets that form clouds. This is called condensation. When the droplets join together and get too heavy, they fall back to the ground as rain, snow, sleet or hail. We call this precipitation.";
      state.title = inputTitle.value; state.text = inputText.value; render();
    }

    function clearText() {
      inputTitle.value = ""; inputText.value = "";
      state.title = ""; state.text = ""; render();
    }

    function shuffleDesign() {
      state.seed = Math.floor(Math.random() * 9999);
      if (state.mess === 0) {
        state.mess = 4;
        document.getElementById('rangeMess').value = 4;
        document.getElementById('valMess').textContent = '4/10';
      }
      render();
    }

    function resetDesign() {
      state.size = 34; state.gap = 56; state.mess = 4; state.indent = false;
      document.getElementById('rangeSize').value = 34; document.getElementById('valSize').textContent = '34px';
      document.getElementById('rangeGap').value = 56; document.getElementById('valGap').textContent = '56px';
      document.getElementById('rangeMess').value = 4; document.getElementById('valMess').textContent = '4/10';
      document.getElementById('chkIndent').checked = false;
      render();
    }

    // === Core Engine ===
    function layout(fam) {
      const P = SIZES[state.page] || SIZES.a4;
      const lined = ['ruled', 'legal', 'vintage', 'music'].includes(state.paper);
      let L = { W: P.w, H: P.h, gap: state.gap, rule: 3 };
      L.top = lined ? 196 : 170; L.mx = lined ? 168 : 120; L.tx = lined ? L.mx + 24 : L.mx;
      L.rx = P.w - 96; L.maxW = L.rx - L.tx;
      L.perPage = Math.max(1, Math.floor((P.h - 104 - L.top) / L.gap) + 1);

      let m = document.createElement('canvas').getContext('2d');
      m.font = '100px "' + fam + '"';
      let xh = m.measureText('x').actualBoundingBoxAscent;
      let norm = (xh && xh > 5) ? Math.max(0.55, Math.min(2.4, 50 / xh)) : 1;
      
      L.fs = Math.round(state.size * norm * 10) / 10;
      m.font = L.fs + 'px "' + fam + '"';
      L.space = Math.max(L.fs * 0.14, m.measureText(' ').width);
      
      let v = state.mess;
      let rnd = mulberry32(state.seed * 7919 + 13);

      function wWidth(t) { return m.measureText(t).width; }

      let lines = [];
      let title = state.title.trim();
      if (title) lines.push({ words: [{ t: title, w: wWidth(title), sc: 1 }], center: true, underline: true });

      let cur = null, curW = 0;
      function newLine(indent) { cur = { words: [], indent: indent || 0 }; curW = cur.indent; }
      function add(t) {
        let sc = 1 + (rnd() * 2 - 1) * v * 0.004;
        let w = wWidth(t) * sc;
        if (w > L.maxW - cur.indent) {
          let g = Array.from(t), chunk = '';
          for (let i = 0; i < g.length; i++) {
            if (chunk && wWidth(chunk + g[i]) * sc > L.maxW) { add2(chunk, sc); chunk = ''; }
            chunk += g[i];
          }
          if (chunk) add2(chunk, sc);
          return;
        }
        add2(t, sc, w);
      }
      function add2(t, sc, w) {
        if (w === undefined) w = wWidth(t) * sc;
        let need = (cur.words.length ? L.space : 0) + w;
        if (cur.words.length && curW + need > L.maxW) { lines.push(cur); newLine(0); need = w; }
        cur.words.push({ t, w, sc }); curW += need;
      }

      state.text.replace(/\r\n?/g, '\n').split('\n').forEach(p => {
        let words = p.split(/[ \t]+/).filter(Boolean);
        if (!words.length) { lines.push({ words: [] }); return; }
        newLine(state.indent ? L.fs * 1.6 : 0);
        words.forEach(add); lines.push(cur);
      });
      
      while (lines.length && !lines[lines.length - 1].words.length) lines.pop();

      let pages = [];
      for (let i = 0; i < lines.length; i += L.perPage) pages.push(lines.slice(i, i + L.perPage));
      if (!pages.length) pages.push([]);
      
      L.pages = pages; L.rnd = rnd;
      return L;
    }

    function drawPaper(ctx, W, H, L) {
      let p = state.paper, y, x, cell;
      
      if (p === 'dark') ctx.fillStyle = '#1e293b';
      else if (p === 'legal') ctx.fillStyle = '#FCF3A5';
      else if (p === 'vintage') ctx.fillStyle = '#fdf6e3';
      else ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, W, H);

      function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }

      if (['ruled', 'legal', 'vintage'].includes(p)) {
        if (p === 'vintage') ctx.strokeStyle = 'rgba(139,69,19,.3)';
        else if (p === 'legal') ctx.strokeStyle = 'rgba(84,118,168,.45)';
        else ctx.strokeStyle = 'rgba(76,138,206,.45)';
        
        ctx.lineWidth = 2;
        let y0 = L.top + L.rule - L.gap;
        if (y0 < 70) y0 = L.top + L.rule;
        for (y = y0; y <= H - 56; y += L.gap) line(0, y, W, y);
        
        ctx.strokeStyle = p === 'vintage' ? 'rgba(139,69,19,.5)' : 'rgba(222,70,80,.55)';
        line(L.mx, 0, L.mx, H);
        if (p === 'legal') line(L.mx - 9, 0, L.mx - 9, H);
      } 
      else if (p === 'music') {
        ctx.strokeStyle = 'rgba(0,0,0,.25)';
        ctx.lineWidth = 1;
        let y0 = 100;
        while(y0 < H - 100) {
          for(let i=0; i<5; i++) line(0, y0 + i*10, W, y0 + i*10);
          y0 += 60;
        }
      }
      else if (p === 'grid' || p === 'dotted') {
        cell = L.gap / 2;
        let sy = (L.top + L.rule) % cell, sx = L.mx % cell;
        if (p === 'grid') {
          ctx.strokeStyle = 'rgba(80,140,210,.26)'; 
          ctx.lineWidth = 1.3;
          for (y = sy; y <= H; y += cell) line(0, y, W, y);
          for (x = sx; x <= W; x += cell) line(x, 0, x, H);
        } else {
          ctx.fillStyle = 'rgba(70,80,110,.4)';
          for (y = sy; y <= H; y += cell) {
            for (x = sx; x <= W; x += cell) {
              ctx.beginPath(); ctx.arc(x, y, 1.9, 0, 6.2832); ctx.fill();
            }
          }
        }
      }
    }

    function applyEffect(c, n) {
      let e = state.effect, W = c.width, H = c.height, ctx = c.getContext('2d');
      
      if (e === 'scan') {
        ctx.globalAlpha = 0.1; ctx.fillStyle = 'rgba(40,40,40,.035)'; ctx.fillRect(0, 0, W, H);
        let o = document.createElement('canvas'); o.width = W; o.height = H;
        let x = o.getContext('2d'); x.fillStyle = '#E9E9E7'; x.fillRect(0, 0, W, H);
        let ang = (((state.seed * 37 + n * 11) % 9) - 4) * 0.0011;
        x.translate(W / 2, H / 2); x.rotate(ang); x.scale(0.982, 0.982);
        x.shadowColor = 'rgba(0,0,0,.18)'; x.shadowBlur = 10;
        x.drawImage(c, -W / 2, -H / 2);
        return o;
      }
      if (e === 'photo') {
        let g = ctx.createLinearGradient(0, 0, W, H);
        g.addColorStop(0, 'rgba(255,248,230,.10)'); g.addColorStop(0.55, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(35,25,5,.22)');
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
        let r = ctx.createRadialGradient(W * 0.42, H * 0.38, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.78);
        r.addColorStop(0, 'rgba(0,0,0,0)'); r.addColorStop(1, 'rgba(0,0,0,.17)');
        ctx.fillStyle = r; ctx.fillRect(0, 0, W, H);
      }
      if (e === 'sepia' || e === 'bw' || e === 'vintage') {
        let o = document.createElement('canvas'); o.width = W; o.height = H;
        let x = o.getContext('2d');
        
        if (e === 'sepia') x.filter = 'sepia(0.8)';
        if (e === 'bw') x.filter = 'grayscale(1) contrast(1.2)';
        if (e === 'vintage') x.filter = 'sepia(0.5) contrast(0.9) brightness(1.1)';
        
        x.drawImage(c, 0, 0);
        
        if (e === 'vintage') {
          let r = x.createRadialGradient(W * 0.42, H * 0.38, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.78);
          r.addColorStop(0, 'rgba(0,0,0,0)'); r.addColorStop(1, 'rgba(50,20,0,.3)');
          x.fillStyle = r; x.fillRect(0, 0, W, H);
        }
        return o;
      }
      
      return c;
    }

    function drawPage(L, lines, n, fam) {
      let W = L.W, H = L.H, v = state.mess, rnd = L.rnd;
      let c = document.createElement('canvas'); c.width = W; c.height = H;
      let ctx = c.getContext('2d');
      drawPaper(ctx, W, H, L);

      let tl = document.createElement('canvas'); tl.width = W; tl.height = H;
      let t = tl.getContext('2d');
      let ink = state.ink, pencil = state.ink === '#404046';
      
      t.font = L.fs + 'px "' + fam + '"';
      t.textBaseline = 'alphabetic';
      t.fillStyle = ink; t.strokeStyle = ink;
      t.shadowColor = hexA(ink, pencil ? 0.2 : 0.45); t.shadowBlur = pencil ? 0.6 : 1.3;

      for (let k = 0; k < lines.length; k++) {
        let ln = lines[k];
        if (!ln.words.length) continue;
        let base = L.top + k * L.gap - 2;
        let drift = (rnd() * 2 - 1) * v * 0.5;
        let lineW = 0;
        ln.words.forEach((o, i) => { lineW += o.w + (i ? L.space : 0); });
        let x = L.tx + (ln.indent || 0) + (rnd() * 2 - 1) * v * 0.6;
        if (ln.center) x = L.tx + Math.max(0, (L.maxW - lineW) / 2);
        let x0 = x;

        for (let i = 0; i < ln.words.length; i++) {
          let o = ln.words[i];
          let prog = (x - L.tx) / L.maxW;
          let dy = drift * prog * 2 + (rnd() * 2 - 1) * v * 0.28;
          let rot = (rnd() * 2 - 1) * v * 0.0022;
          t.save();
          t.translate(x, base + dy);
          t.rotate(rot);
          if (o.sc !== 1) t.scale(o.sc, o.sc);
          t.globalAlpha = Math.max(0.74, 1 - rnd() * v * 0.022);
          t.fillText(o.t, 0, 0);
          t.restore();
          x += o.w + L.space + (rnd() * 2 - 1) * v * 0.5;
        }

        if (ln.underline) {
          let x1 = x - L.space, uy = base + L.fs * 0.2;
          t.save();
          t.lineWidth = Math.max(1.6, L.fs * 0.045); t.lineCap = 'round'; t.globalAlpha = 0.92;
          t.beginPath(); t.moveTo(x0 - 6, uy); t.lineTo(x1, uy); t.stroke(); t.restore();
        }
      }

      ctx.globalCompositeOperation = 'multiply';
      ctx.globalAlpha = pencil ? 0.9 : 0.97;
      ctx.drawImage(tl, 0, 0);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      
      return applyEffect(c, n);
    }

    function render() {
      let fam = state.font === 'custom' && customFamily ? customFamily : state.font;
      if (window.document.fonts && window.document.fonts.load) {
        document.fonts.load('40px "' + fam + '"', state.text.slice(0, 50) || 'Hello').then(() => {
          try {
            let L = layout(fam);
            let list = [];
            for (let i = 0; i < L.pages.length; i++) list.push(drawPage(L, L.pages[i], i, fam));
            pageCanvases = list;
            showPages();
          } catch (e) { console.error(e); }
        });
      }
    }

    function showPages() {
      let n = pageCanvases.length;
      canvasWrapper.innerHTML = '';
      pageCanvases.forEach(cv => canvasWrapper.appendChild(cv));
      let P = SIZES[state.page] || SIZES.a4;
      document.getElementById('infoPages').textContent = n + (n === 1 ? ' page' : ' pages');
      document.getElementById('infoSize').textContent = P.label;
    }

    function downloadImage() {
      const format = document.getElementById('imageFormat').value;
      pageCanvases.forEach((cv, i) => {
        setTimeout(() => {
          let a = document.createElement('a');
          a.download = 'handwriting' + (pageCanvases.length > 1 ? '-page-' + (i + 1) : '') + '.' + format;
          a.href = cv.toDataURL('image/' + format, 0.92);
          a.click();
        }, i * 450);
      });
    }

    function downloadPDF() {
      const { jsPDF } = window.jspdf;
      let P = SIZES[state.page] || SIZES.a4;
      let pdf = new jsPDF('p', 'pt', [P.pw, P.ph]);
      pageCanvases.forEach((cv, i) => {
        if (i > 0) pdf.addPage([P.pw, P.ph]);
        pdf.addImage(cv.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, P.pw, P.ph);
      });
      pdf.save('handwriting.pdf');
    }

    window.addEventListener('DOMContentLoaded', initUI);
  </script>
</body>
